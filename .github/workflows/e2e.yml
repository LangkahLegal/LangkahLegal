name: E2E Tests

on:
  push:
    branches: [main, dev, develop]
  pull_request:
    branches: [main, dev, develop]

env:
  PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL || vars.PLAYWRIGHT_BASE_URL || 'http://localhost:3000' }}
  PLAYWRIGHT_API_URL: ${{ secrets.PLAYWRIGHT_API_URL || vars.PLAYWRIGHT_API_URL || 'http://127.0.0.1:8000/api/v1' }}
  NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || vars.NEXT_PUBLIC_API_URL || 'http://127.0.0.1:8000/api/v1' }}
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  NEXT_PUBLIC_IMGBB_API_KEY: ${{ secrets.NEXT_PUBLIC_IMGBB_API_KEY || vars.NEXT_PUBLIC_IMGBB_API_KEY }}
  NEXT_PUBLIC_MIDTRANS_CLIENT_KEY: ${{ secrets.NEXT_PUBLIC_MIDTRANS_CLIENT_KEY || vars.NEXT_PUBLIC_MIDTRANS_CLIENT_KEY }}
  NEXT_PUBLIC_MIDTRANS_IS_PRODUCTION: ${{ secrets.NEXT_PUBLIC_MIDTRANS_IS_PRODUCTION || vars.NEXT_PUBLIC_MIDTRANS_IS_PRODUCTION }}
  APP_ENV: ${{ secrets.APP_ENV || vars.APP_ENV }}
  APP_NAME: ${{ secrets.APP_NAME || vars.APP_NAME }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || vars.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY || vars.SUPABASE_KEY }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || vars.SUPABASE_KEY }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
  SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET || vars.SUPABASE_JWT_SECRET }}
  SUPABASE_PORTOFOLIO_BUCKET: ${{ secrets.SUPABASE_PORTOFOLIO_BUCKET || vars.SUPABASE_PORTOFOLIO_BUCKET }}
  SUPABASE_BERKAS_PENDUKUNG_BUCKET: ${{ secrets.SUPABASE_BERKAS_PENDUKUNG_BUCKET || vars.SUPABASE_BERKAS_PENDUKUNG_BUCKET }}
  SUPABASE_KNOWLEDGE_BUCKET: ${{ secrets.SUPABASE_KNOWLEDGE_BUCKET || vars.SUPABASE_KNOWLEDGE_BUCKET }}
  IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY || vars.IMGBB_API_KEY }}
  FRONTEND_URL: ${{ secrets.FRONTEND_URL || vars.FRONTEND_URL || 'http://localhost:3000' }}
  MIDTRANS_SERVER_KEY: ${{ secrets.MIDTRANS_SERVER_KEY || vars.MIDTRANS_SERVER_KEY }}
  MIDTRANS_CLIENT_KEY: ${{ secrets.MIDTRANS_CLIENT_KEY || vars.MIDTRANS_CLIENT_KEY }}
  MIDTRANS_IS_PRODUCTION: ${{ secrets.MIDTRANS_IS_PRODUCTION || vars.MIDTRANS_IS_PRODUCTION }}
  PASAL_API_TOKEN: ${{ secrets.PASAL_API_TOKEN || vars.PASAL_API_TOKEN }}
  GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || vars.GOOGLE_API_KEY }}
  VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY || vars.VOYAGE_API_KEY }}
  E2E_CLIENT_EMAIL: ${{ secrets.E2E_CLIENT_EMAIL || vars.E2E_CLIENT_EMAIL }}
  E2E_CLIENT_PASSWORD: ${{ secrets.E2E_CLIENT_PASSWORD || vars.E2E_CLIENT_PASSWORD }}
  E2E_CONSULTANT_EMAIL: ${{ secrets.E2E_CONSULTANT_EMAIL || vars.E2E_CONSULTANT_EMAIL }}
  E2E_CONSULTANT_PASSWORD: ${{ secrets.E2E_CONSULTANT_PASSWORD || vars.E2E_CONSULTANT_PASSWORD }}
  E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL || vars.E2E_ADMIN_EMAIL }}
  E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD || vars.E2E_ADMIN_PASSWORD }}
  E2E_ENABLE_BOOKING: ${{ secrets.E2E_ENABLE_BOOKING || vars.E2E_ENABLE_BOOKING }}
  E2E_ENABLE_AI: ${{ secrets.E2E_ENABLE_AI || vars.E2E_ENABLE_AI }}
  E2E_ENABLE_SCHEDULE_SAVE: ${{ secrets.E2E_ENABLE_SCHEDULE_SAVE || vars.E2E_ENABLE_SCHEDULE_SAVE }}
  E2E_PAYMENT_REQUEST_ID: ${{ secrets.E2E_PAYMENT_REQUEST_ID || vars.E2E_PAYMENT_REQUEST_ID }}
  E2E_WEB_SERVER_COMMAND: ${{ secrets.E2E_WEB_SERVER_COMMAND || vars.E2E_WEB_SERVER_COMMAND }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Start backend
        working-directory: backend
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 5

      - name: Start frontend
        working-directory: frontend
        run: |
          npm run build
          npm run start -- -p 3000 &
          sleep 5

      - name: Wait for services
        run: |
          echo "Waiting for frontend..."
          timeout 30 bash -c 'until curl -s http://localhost:3000 > /dev/null; do sleep 1; done'
          echo "Frontend is ready"
          echo "Waiting for backend..."
          timeout 30 bash -c 'until curl -s http://127.0.0.1:8000/docs > /dev/null; do sleep 1; done'
          echo "Backend is ready"

      - name: Run E2E tests
        working-directory: frontend
        run: npx playwright test --project=chromium

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/tests/e2e/results/
          retention-days: 14

      # ── Auto-create GitHub Issue on failure ──────────────────
      - name: Create GitHub Issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const branch = context.ref.replace('refs/heads/', '');
            const sha = context.sha.substring(0, 7);
            const actor = context.actor;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 E2E Tests Failed — ${branch} (${sha})`,
              body: [
                `## E2E Test Failure Report`,
                ``,
                `| Detail | Value |`,
                `|--------|-------|`,
                `| **Branch** | \`${branch}\` |`,
                `| **Commit** | \`${sha}\` |`,
                `| **Triggered by** | @${actor} |`,
                `| **Run** | [View workflow run](${runUrl}) |`,
                ``,
                `### What to do`,
                `1. Click the workflow run link above`,
                `2. Download the \`playwright-report\` artifact`,
                `3. Extract and open \`html-report/index.html\` in your browser`,
                `4. Fix the failing tests and push again`,
                ``,
                `> This issue was auto-generated by the E2E CI pipeline.`,
              ].join('\n'),
              labels: ['bug', 'e2e-test'],
            });
