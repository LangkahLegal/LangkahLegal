name: E2E Tests

on:
  push:
    branches: [main, dev, develop]
  pull_request:
    branches: [main, dev, develop]

env:
  PLAYWRIGHT_BASE_URL: http://localhost:3000
  PLAYWRIGHT_API_URL: http://127.0.0.1:8000/api/v1

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Start backend
        working-directory: backend
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 5
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: Start frontend
        working-directory: frontend
        run: |
          npm run build
          npm run start &
          sleep 5
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1

      - name: Wait for services
        run: |
          echo "Waiting for frontend..."
          timeout 30 bash -c 'until curl -s http://localhost:3000 > /dev/null; do sleep 1; done'
          echo "Frontend is ready"
          echo "Waiting for backend..."
          timeout 30 bash -c 'until curl -s http://127.0.0.1:8000/docs > /dev/null; do sleep 1; done'
          echo "Backend is ready"

      - name: Run E2E tests
        working-directory: frontend
        run: npx playwright test --project=chromium
        env:
          E2E_CLIENT_EMAIL: ${{ secrets.E2E_CLIENT_EMAIL }}
          E2E_CLIENT_PASSWORD: ${{ secrets.E2E_CLIENT_PASSWORD }}
          E2E_CONSULTANT_EMAIL: ${{ secrets.E2E_CONSULTANT_EMAIL }}
          E2E_CONSULTANT_PASSWORD: ${{ secrets.E2E_CONSULTANT_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/tests/e2e/results/
          retention-days: 14

      # ── Auto-create GitHub Issue on failure ──────────────────
      - name: Create GitHub Issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const branch = context.ref.replace('refs/heads/', '');
            const sha = context.sha.substring(0, 7);
            const actor = context.actor;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 E2E Tests Failed — ${branch} (${sha})`,
              body: [
                `## E2E Test Failure Report`,
                ``,
                `| Detail | Value |`,
                `|--------|-------|`,
                `| **Branch** | \`${branch}\` |`,
                `| **Commit** | \`${sha}\` |`,
                `| **Triggered by** | @${actor} |`,
                `| **Run** | [View workflow run](${runUrl}) |`,
                ``,
                `### What to do`,
                `1. Click the workflow run link above`,
                `2. Download the \`playwright-report\` artifact`,
                `3. Extract and open \`html-report/index.html\` in your browser`,
                `4. Fix the failing tests and push again`,
                ``,
                `> This issue was auto-generated by the E2E CI pipeline.`,
              ].join('\n'),
              labels: ['bug', 'e2e-test'],
            });
