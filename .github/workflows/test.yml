name: API Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  pytest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: pip install -r qa/api/requirements.txt

      - name: Run ruff
        run: |
          python -m ruff check backend qa/api
          python -m ruff format --check backend qa/api

      - name: Run pytest
        run: python -m pytest qa/api
